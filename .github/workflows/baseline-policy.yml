name: baseline policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate organization baseline
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            profile/README.md
            CONTRIBUTING.md
            SECURITY.md
            SUPPORT.md
            CODE_OF_CONDUCT.md
            GOVERNANCE.md
            agents.md
            ORGANIZATION_ROUTING.md
            organization-routing.json
            docs/PROJECTS.md
            schema/organization-routing.schema.json
            schema/project-registry-artifact.schema.json
            scripts/build-project-registry.py
            tests/test_project_registry.py
            repository-relationships.json
            organization-policy.json
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error file=$file::required baseline file is missing or empty"; exit 1; }
          done
          python3 -m json.tool organization-policy.json >/dev/null
          python3 -m json.tool organization-routing.json >/dev/null
          python3 -m json.tool repository-relationships.json >/dev/null
          python3 -m json.tool schema/organization-routing.schema.json >/dev/null
          python3 -m json.tool schema/project-registry-artifact.schema.json >/dev/null
          python3 -m unittest discover -s tests -p 'test_project_registry.py' -v
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'
